kind = "web"
previewPath = "/"
title = "Restaurant Website Demo"
version = "1.0.0"
id = "artifacts/bisbas-restaurant"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19088

[services.development]
run = "pnpm --filter @workspace/bisbas-restaurant run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bisbas-restaurant", "run", "build" ]
publicDir = "artifacts/bisbas-restaurant/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19088"
BASE_PATH = "/"
