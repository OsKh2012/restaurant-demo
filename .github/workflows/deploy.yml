name: Deploy original restaurant demo

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          package_json_file: Basic-placeholder-for-restaraunts/package.json

      - name: Install only the restaurant workspace
        working-directory: ./Basic-placeholder-for-restaraunts
        run: pnpm install --frozen-lockfile --filter @workspace/bisbas-restaurant

      - name: Build the original React/Vite app
        working-directory: ./Basic-placeholder-for-restaraunts/artifacts/bisbas-restaurant
        env:
          NODE_ENV: production
          PORT: "4173"
          BASE_PATH: "/restaurant-demo/"
        run: pnpm run build

      - name: Verify build
        working-directory: ./Basic-placeholder-for-restaraunts/artifacts/bisbas-restaurant
        run: |
          test -f dist/public/index.html
          echo "Original design built successfully."
          find dist/public -maxdepth 2 -type f | head -50

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload original build
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./Basic-placeholder-for-restaraunts/artifacts/bisbas-restaurant/dist/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
