name: Deploy original restaurant demo

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          package_json_file: Basic-placeholder-for-restaraunts/package.json

      - name: Install workspace dependencies
        working-directory: ./Basic-placeholder-for-restaraunts
        run: pnpm install --frozen-lockfile

      - name: Build original React app
        working-directory: ./Basic-placeholder-for-restaraunts/artifacts/bisbas-restaurant
        env:
          NODE_ENV: production
          PORT: "4173"
          BASE_PATH: "/restaurant-demo/"
        run: pnpm run build

      - name: Verify original build
        working-directory: ./Basic-placeholder-for-restaraunts/artifacts/bisbas-restaurant
        run: |
          test -f dist/public/index.html
          echo "Original React/Vite build succeeded."
          find dist/public -maxdepth 2 -type f | head -50

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload original build
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./Basic-placeholder-for-restaraunts/artifacts/bisbas-restaurant/dist/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
