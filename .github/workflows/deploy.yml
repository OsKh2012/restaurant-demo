name: Deploy restaurant demo

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./Basic-placeholder-for-restaraunts/artifacts/bisbas-restaurant
        run: npm install

      - name: Build
        working-directory: ./Basic-placeholder-for-restaraunts/artifacts/bisbas-restaurant
        env:
          PORT: "4173"
          BASE_PATH: "/restaurant-demo/"
        run: npm run build

      - name: Verify build
        working-directory: ./Basic-placeholder-for-restaraunts/artifacts/bisbas-restaurant
        run: |
          test -f dist/public/index.html
          echo "Built index.html successfully"
          find dist/public -maxdepth 2 -type f | head -50

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Basic-placeholder-for-restaraunts/artifacts/bisbas-restaurant/dist/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
